# Same as mixtral-llmisvc.yaml, but the init container downloads ONLY the files
# vLLM needs (safetensors + config + tokenizer) instead of the whole repo.
# This roughly halves the download (~93 GB vs ~190 GB).
#
# It overrides the storage-initializer command to call huggingface_hub's
# snapshot_download with allow_patterns.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: mixtral
  namespace: default
spec:
  model:
    uri: hf://mistralai/Mixtral-8x7B-Instruct-v0.1
    name: mistralai/Mixtral-8x7B-Instruct-v0.1
  storageInitializer:
    enabled: false
  router:
    scheduler: {}
    route: {}
  template:
    volumes:
      - name: kserve-pvc-source
        emptyDir: {}
    initContainers:
      - name: storage-initializer
        image: docker.io/charmedkubeflow/storage-initializer:0.17.0-07d37fb
        command: ["python3"]
        args:
          - "-c"
          - |
            from huggingface_hub import snapshot_download
            snapshot_download(
                "mistralai/Mixtral-8x7B-Instruct-v0.1",
                local_dir="/mnt/models",
                allow_patterns=["*.safetensors", "*.json", "*.model", "*.txt"],
            )
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: HF_TOKEN
          - name: HF_HUB_ENABLE_HF_TRANSFER
            value: "0"
          - name: HF_HUB_DOWNLOAD_TIMEOUT
            value: "60"
        volumeMounts:
          - name: kserve-pvc-source
            mountPath: /mnt/models
    containers:
      - name: main
        image: docker.io/charmedkubeflow/vllm-cuda-gpu:0.19.0-e511371-20260702095505
        args: ["--tensor-parallel-size", "2"]
        securityContext:
          runAsNonRoot: false
        env:
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: HF_TOKEN
        volumeMounts:
          - name: kserve-pvc-source
            mountPath: /mnt/models
            readOnly: true
        resources:
          requests:
            cpu: "4"
            memory: "32Gi"
            nvidia.com/gpu: "2"
          limits:
            cpu: "8"
            memory: "96Gi"
            nvidia.com/gpu: "2"
